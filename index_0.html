<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Explosion Sprite Sheet Tester</title>

<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at center, #202431, #05060a);
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
  }

  h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0;
  }

  canvas {
    width: 256px;
    height: 256px;
    image-rendering: auto;
    background: transparent;
  }

  .panel {
    display: flex;
    flex-direction: column;
    gap: 14px;
    background: rgba(255,255,255,0.08);
    padding: 18px;
    border-radius: 14px;
    min-width: 300px;
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  button {
    padding: 10px 14px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
  }

  input[type="range"] {
    width: 170px;
  }

  label {
    font-size: 14px;
  }

  .value {
    font-family: monospace;
    opacity: 0.85;
  }
</style>
</head>

<body>

<h1>Explosion Sprite Sheet Tester</h1>

<canvas id="spriteCanvas" width="256" height="256"></canvas>

<div class="panel">
  <div class="row">
    <button id="playPauseBtn">Pause</button>
    <button id="restartBtn">Restart</button>
  </div>

  <div class="row">
    <label for="speedSlider">Speed</label>
    <input id="speedSlider" type="range" min="20" max="300" value="80" />
    <span class="value"><span id="speedValue">80</span> ms</span>
  </div>

  <div class="row">
    <label for="loopToggle">Loop animation</label>
    <input id="loopToggle" type="checkbox" checked />
  </div>

  <div class="row">
    <label>Frame</label>
    <span class="value" id="frameCounter">1 / 16</span>
  </div>
</div>

<script>
  const canvas = document.getElementById("spriteCanvas");
  const ctx = canvas.getContext("2d");

  const playPauseBtn = document.getElementById("playPauseBtn");
  const restartBtn = document.getElementById("restartBtn");
  const speedSlider = document.getElementById("speedSlider");
  const speedValue = document.getElementById("speedValue");
  const loopToggle = document.getElementById("loopToggle");
  const frameCounter = document.getElementById("frameCounter");

  const sprite = new Image();

  // Change this filename if your PNG has a different name.
  sprite.src = "explosion.png";

  const frameWidth = 256;
  const frameHeight = 256;
  const columns = 4;
  const rows = 4;
  const totalFrames = columns * rows;

  let currentFrame = 0;
  let isPlaying = true;
  let frameDuration = Number(speedSlider.value);
  let lastFrameTime = 0;

  function drawFrame(frameIndex) {
    const col = frameIndex % columns;
    const row = Math.floor(frameIndex / columns);

    const sx = col * frameWidth;
    const sy = row * frameHeight;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.drawImage(
      sprite,
      sx,
      sy,
      frameWidth,
      frameHeight,
      0,
      0,
      frameWidth,
      frameHeight
    );

    frameCounter.textContent = `${frameIndex + 1} / ${totalFrames}`;
  }

  function animate(timestamp) {
    if (!lastFrameTime) lastFrameTime = timestamp;

    if (isPlaying && timestamp - lastFrameTime >= frameDuration) {
      currentFrame++;

      if (currentFrame >= totalFrames) {
        if (loopToggle.checked) {
          currentFrame = 0;
        } else {
          currentFrame = totalFrames - 1;
          isPlaying = false;
          playPauseBtn.textContent = "Play";
        }
      }

      drawFrame(currentFrame);
      lastFrameTime = timestamp;
    }

    requestAnimationFrame(animate);
  }

  playPauseBtn.addEventListener("click", () => {
    isPlaying = !isPlaying;
    playPauseBtn.textContent = isPlaying ? "Pause" : "Play";
  });

  restartBtn.addEventListener("click", () => {
    currentFrame = 0;
    isPlaying = true;
    playPauseBtn.textContent = "Pause";
    lastFrameTime = 0;
    drawFrame(currentFrame);
  });

  speedSlider.addEventListener("input", () => {
    frameDuration = Number(speedSlider.value);
    speedValue.textContent = frameDuration;
  });

  sprite.onload = () => {
    drawFrame(currentFrame);
    requestAnimationFrame(animate);
  };
</script>

</body>
</html>
